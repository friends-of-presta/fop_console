name: PHPUnit
on:
  - push
  - pull_request
jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add kjmodulebedrock as a test module
        uses: actions/checkout@v4
        with:
          repository: "Kaudaj/kjmodulebedrock"
          ref: "b1bf4921fe017498120237c3744daeb9fb81675e"
          path: "tests/Resources/modules/kjmodulebedrock"

      - name: Cache vendor folder
        uses: actions/cache@v4
        with:
          path: vendor
          key: php-${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}

      - name: Cache composer folder
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: php-composer-cache

      - name: "Setup PHP ${{ matrix.php-version }}"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: "Install Composer"
        run: composer install

      - name: Run PHPUnit
        run: |
          cd ${{ github.workspace }}
          ./vendor/bin/phpunit -c tests/Unit/phpunit.xml
